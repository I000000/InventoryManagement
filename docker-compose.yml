networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: ims_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    ports:
      - "5432:5432"
    volumes:
      - ims_pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ims_redis
    ports:
      - "6379:6379"
    volumes:
      - ims_redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:22.3.3.44-alpine
    container_name: ims_clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-inventory}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-inventory}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ims_ch_data:/var/lib/clickhouse
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: ims_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka:
    image: wurstmeister/kafka:latest
    container_name: ims_kafka
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    container_name: ims_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ims_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ims_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ims_grafana_data:/var/lib/grafana
    networks:
      - app-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: ims_jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app-network

  inventory-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: ims_api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-inventory}
      - DB_PASS=${DB_PASS:-inventory}
      - DB_NAME=${DB_NAME:-inventory}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_MAX_CONNS=${DB_MAX_CONNS:-10}
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-stock-events}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - SERVER_PORT=8080
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-5m}
      - STOCK_CACHE_TTL=${STOCK_CACHE_TTL:-5m}
      - RATE_LIMIT=${RATE_LIMIT:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-1s}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=inventory-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  stock-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: ims_worker
    environment:
      - CLICKHOUSE_HOST=clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-inventory}
      - CLICKHOUSE_PASS=${CLICKHOUSE_PASS:-inventory}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-stock-events}
      - KAFKA_GROUP=${KAFKA_GROUP:-stock-worker-group}
      - KAFKA_CONSUMER_WORKERS=${KAFKA_CONSUMER_WORKERS:-5}
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=inventory-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.outbox
    container_name: ims_outbox_worker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-inventory}
      - DB_PASS=${DB_PASS:-inventory}
      - DB_NAME=${DB_NAME:-inventory}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=stock-events
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=inventory-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  clickhouse-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.clickhouse-migrate
    container_name: ims_clickhouse_migrate
    environment:
      - CLICKHOUSE_HOST=clickhouse:9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-inventory}
      - CLICKHOUSE_PASS=${CLICKHOUSE_PASS:-inventory}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  postgres-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.postgres-migrate
    container_name: ims_postgres_migrate
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-inventory}
      - DB_PASS=${DB_PASS:-inventory}
      - DB_NAME=${DB_NAME:-inventory}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  k6:
    build:
      context: ./backend/tests/k6
      dockerfile: Dockerfile
    container_name: ims_k6
    environment:
      - K6_BASE_URL=http://inventory-api:8080
    depends_on:
      inventory-api:
        condition: service_started
    networks:
      - app-network
    restart: "no"
    profiles:
      - loadtest

volumes:
  ims_pg_data:
  ims_redis_data:
  ims_ch_data:
  ims_prometheus_data:
  ims_grafana_data: