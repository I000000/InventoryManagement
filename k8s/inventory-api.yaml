apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
      - name: api
        image: sadsadsadsad/inventory-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: inventory-config
        - secretRef:
            name: inventory-secrets
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: inventory-secrets
              key: DB_PASS
        - name: CLICKHOUSE_PASS
          valueFrom:
            secretKeyRef:
              name: inventory-secrets
              key: CLICKHOUSE_PASS
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: inventory-system
spec:
  selector:
    app: inventory-api
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP